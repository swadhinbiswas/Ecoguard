<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Eco-Guard MLOps{% endblock %}</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://unpkg.com/htmx.org@1.9.11"></script>
    <style>
        :root {
            --bg: #0a0e14;
            --surface: #141b22;
            --surface2: #1c2330;
            --border: #293040;
            --text: #cdd6e0;
            --text2: #8997a9;
            --accent: #4da6ff;
            --accent2: #2e7dd1;
            --green: #3fb950;
            --yellow: #d29922;
            --red: #f85149;
            --purple: #a371f7;
            --radius: 10px;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg); color: var(--text); display: flex; min-height: 100vh;
            font-size: 14px; line-height: 1.5;
        }
        .sidebar {
            width: 240px; min-width: 240px; background: var(--surface);
            border-right: 1px solid var(--border); padding: 20px 0;
            display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh;
        }
        .sidebar-logo {
            padding: 0 20px 20px; border-bottom: 1px solid var(--border); margin-bottom: 12px;
        }
        .sidebar-logo h1 { font-size: 18px; color: var(--accent); font-weight: 700; }
        .sidebar-logo span { font-size: 11px; color: var(--text2); display: block; margin-top: 2px; }
        .sidebar-nav { flex:1; padding: 0 12px; }
        .sidebar-nav a {
            display: flex; align-items: center; gap: 10px; padding: 10px 12px;
            border-radius: 8px; color: var(--text2); text-decoration: none;
            font-size: 13px; font-weight: 500; margin-bottom: 2px; transition: all .15s;
        }
        .sidebar-nav a:hover { background: var(--surface2); color: var(--text); }
        .sidebar-nav a.active { background: var(--accent); color: #fff; }
        .sidebar-nav .icon { font-size: 16px; width: 20px; text-align: center; }
        .sidebar-status { padding: 16px 20px; border-top: 1px solid var(--border); font-size: 12px; }
        .sidebar-status .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
        .dot.green { background: var(--green); }
        .dot.yellow { background: var(--yellow); }
        .dot.red { background: var(--red); }
        .content { flex: 1; padding: 28px 32px; overflow-y: auto; max-height: 100vh; }
        .page-header { margin-bottom: 24px; }
        .page-header h2 { font-size: 22px; font-weight: 700; }
        .page-header p { color: var(--text2); font-size: 13px; margin-top: 2px; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
        .stat-card {
            background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
            padding: 18px 20px;
        }
        .stat-card .label { font-size: 12px; color: var(--text2); text-transform: uppercase; letter-spacing: 0.5px; }
        .stat-card .value { font-size: 28px; font-weight: 700; margin: 4px 0; }
        .stat-card .sub { font-size: 12px; color: var(--text2); }
        .card {
            background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
            padding: 20px; margin-bottom: 20px;
        }
        .card h3 { font-size: 15px; font-weight: 600; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
        .card h3 .badge { font-size: 11px; padding: 2px 8px; border-radius: 10px; font-weight: 600; }
        .badge.green { background: rgba(63,185,80,.15); color: var(--green); }
        .badge.yellow { background: rgba(210,153,34,.15); color: var(--yellow); }
        .badge.red { background: rgba(248,81,73,.15); color: var(--red); }
        .badge.blue { background: rgba(77,166,255,.15); color: var(--accent); }
        .badge.purple { background: rgba(163,113,247,.15); color: var(--purple); }

        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th { text-align: left; padding: 10px 12px; color: var(--text2); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid var(--border); }
        td { padding: 12px 12px; border-bottom: 1px solid var(--border); }
        tr:hover td { background: rgba(255,255,255,.02); }

        .btn {
            display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px;
            border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer;
            border: none; text-decoration: none; transition: all .15s;
        }
        .btn-primary { background: var(--accent); color: #fff; }
        .btn-primary:hover { background: var(--accent2); }
        .btn-secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
        .btn-secondary:hover { background: var(--border); }
        .btn-danger { background: rgba(248,81,73,.15); color: var(--red); }
        .btn-danger:hover { background: rgba(248,81,73,.25); }
        .btn-sm { padding: 4px 10px; font-size: 12px; border-radius: 6px; }

        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 12px; color: var(--text2); font-weight: 600; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%; padding: 10px 12px; background: var(--surface2); border: 1px solid var(--border);
            border-radius: 8px; color: var(--text); font-size: 13px; font-family: inherit;
        }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            outline: none; border-color: var(--accent);
        }
        .form-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }

        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }

        canvas { max-height: 280px; }

        .alert { padding: 12px 16px; border-radius: 8px; margin-bottom: 16px; font-size: 13px; }
        .alert-success { background: rgba(63,185,80,.1); border: 1px solid rgba(63,185,80,.3); color: var(--green); }
        .alert-error { background: rgba(248,81,73,.1); border: 1px solid rgba(248,81,73,.3); color: var(--red); }
        .alert-warning { background: rgba(210,153,34,.1); border: 1px solid rgba(210,153,34,.3); color: var(--yellow); }

        .empty-state { text-align: center; padding: 40px; color: var(--text2); }
        .empty-state .icon { font-size: 48px; margin-bottom: 12px; }

        .tag { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; background: var(--surface2); }
        .mono { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 12px; }

        .tabs { display: flex; gap: 4px; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 0; }
        .tab { padding: 8px 16px; font-size: 13px; color: var(--text2); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; transition: all .15s; background: none; border-top: none; border-left: none; border-right: none; font-family: inherit; }
        .tab:hover { color: var(--text); }
        .tab.active { color: var(--accent); border-bottom-color: var(--accent); }

        .pulse { animation: pulse 2s ease-in-out infinite; }
        @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:.5; } }

        .chart-container { position: relative; width: 100%; }
    </style>
</head>
<body>
    <aside class="sidebar">
        <div class="sidebar-logo">
            <h1>Eco-Guard</h1>
            <span>MLOps Platform</span>
        </div>
        <nav class="sidebar-nav">
            <a href="/dashboard" class="{{ 'active' if current_page == 'dashboard' else '' }}">
                <span class="icon">◫</span> Overview
            </a>
            <a href="/dashboard/models" class="{{ 'active' if current_page == 'models' else '' }}">
                <span class="icon">⬡</span> Model Registry
            </a>
            <a href="/dashboard/inference" class="{{ 'active' if current_page == 'inference' else '' }}">
                <span class="icon">⚡</span> Inference
            </a>
            <a href="/dashboard/drift" class="{{ 'active' if current_page == 'drift' else '' }}">
                <span class="icon">📈</span> Drift Monitor
            </a>
            <a href="/dashboard/experiments" class="{{ 'active' if current_page == 'experiments' else '' }}">
                <span class="icon">🧪</span> Experiments
            </a>
            <a href="/dashboard/jobs" class="{{ 'active' if current_page == 'jobs' else '' }}">
                <span class="icon">⚙</span> Training Jobs
            </a>
            <a href="/dashboard/datasets" class="{{ 'active' if current_page == 'datasets' else '' }}">
                <span class="icon">📦</span> Datasets
            </a>
        </nav>
        <div class="sidebar-status">
            <div><span class="dot {{ 'green' if model_loaded else 'red' }}"></span> Model: {{ 'Loaded' if model_loaded else 'Offline' }}</div>
            <div style="margin-top:4px">v{{ version }}</div>
        </div>
    </aside>
    <main class="content">
        {% block content %}{% endblock %}
    </main>

    <script>
    document.addEventListener('DOMContentLoaded', function() {
        {% block scripts %}{% endblock %}
    });
    </script>
</body>
</html>
