<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Eco-Guard</title>
    <style>
        :root { --bg: #0a0e14; --surface: #141b22; --border: #293040; --text: #cdd6e0; --text2: #8997a9; --accent: #4da6ff; --red: #f85149; }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .login-box { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 40px; width: 100%; max-width: 400px; }
        .login-box h1 { font-size: 24px; color: var(--accent); margin-bottom: 4px; }
        .login-box p { color: var(--text2); font-size: 13px; margin-bottom: 24px; }
        .field { margin-bottom: 16px; }
        .field label { display: block; font-size: 12px; color: var(--text2); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
        .field input { width: 100%; padding: 12px; background: #1c2330; border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 14px; font-family: inherit; }
        .field input:focus { outline: none; border-color: var(--accent); }
        .btn { width: 100%; padding: 12px; border-radius: 8px; border: none; font-size: 14px; font-weight: 600; cursor: pointer; background: var(--accent); color: #fff; margin-top: 8px; }
        .btn:hover { opacity: 0.9; }
        .error { background: rgba(248,81,73,.1); border: 1px solid rgba(248,81,73,.3); color: var(--red); padding: 10px 14px; border-radius: 8px; margin-bottom: 16px; font-size: 13px; display: none; }
    </style>
</head>
<body>
    <div class="login-box">
        <h1>Eco-Guard</h1>
        <p>MLOps Platform — Sign in to continue</p>
        <div class="error" id="error">Invalid credentials</div>
        <form id="loginForm">
            <div class="field">
                <label>Username</label>
                <input type="text" name="username" value="admin" required autofocus>
            </div>
            <div class="field">
                <label>Password</label>
                <input type="password" name="password" value="admin" required>
            </div>
            <button type="submit" class="btn">Sign In</button>
        </form>
    </div>

    <script>
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const fd = new FormData(this);
        try {
            const r = await fetch('/api/v1/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    username: fd.get('username'),
                    password: fd.get('password')
                })
            });
            if (r.ok) {
                const data = await r.json();
                document.cookie = 'eco_guard_token=' + data.access_token + ';path=/;max-age=86400;SameSite=Lax';
                const redirect = new URLSearchParams(location.search).get('redirect') || '/dashboard';
                location.href = redirect;
            } else {
                document.getElementById('error').style.display = 'block';
            }
        } catch(err) {
            document.getElementById('error').style.display = 'block';
        }
    });
    </script>
</body>
</html>
