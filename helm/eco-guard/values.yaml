replicaCount: 2

image:
  repository: eco-guard
  tag: latest
  pullPolicy: Always

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

ingress:
  enabled: true
  className: nginx
  host: eco-guard.local
  tls:
    - secretName: eco-guard-tls
      hosts:
        - eco-guard.local

resources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    cpu: 2000m
    memory: 2Gi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPU: 70
  targetMemory: 80

config:
  environment: production
  logLevel: INFO
  authEnabled: true
  rateLimitEnabled: true
  rateLimitRequests: 100
  rateLimitWindowSeconds: 60
  metricsEnabled: true
  cacheEnabled: true
  cacheTtlSeconds: 300
  cacheMaxEntries: 1000
  maxConcurrentInference: 4
  modelWarmupEnabled: true
  autoMigrate: true
  driftAlertThreshold: 0.8
  requestTimeoutSeconds: 120
  circuitBreakerEnabled: true
  shutdownDrainTimeout: 15
  demoMode: false
  corsOrigins: []
  guardrailsEnabled: false
  ipAllowlist: []
  modelWarmupPrompt: "Hello"

secrets:
  databaseUrl: ""
  jwtSecret: ""
  adminUsername: ""
  adminPassword: ""
  apiKeys: ""
  redisUrl: ""
  googleClientId: ""
  googleClientSecret: ""
  githubClientId: ""
  githubClientSecret: ""
  slackWebhookUrl: ""
  discordWebhookUrl: ""
  alertingWebhookUrl: ""

postgresql:
  enabled: true
  auth:
    username: postgres
    password: ""
    database: ecoguard
  primary:
    persistence:
      size: 10Gi

redis:
  enabled: false
  auth:
    enabled: false
  architecture: standalone

modelVolume:
  enabled: true
  storageClass: ""
  size: 20Gi
  accessMode: ReadWriteOnce

monitoring:
  serviceMonitor:
    enabled: false
  prometheus:
    scrape: true
    port: 8000
    path: /metrics

tracing:
  enabled: false
  otlpEndpoint: ""

alerts:
  webhookUrl: ""

serviceAccount:
  create: true
  name: ""

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

podAntiAffinity:
  enabled: true

networkPolicy:
  enabled: true

podDisruptionBudget:
  enabled: true
  minAvailable: 1
