apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: eco-guard-hpa
  labels:
    app: eco-guard
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: eco-guard-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 2
          periodSeconds: 30
