<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4da6ff"/>
      <stop offset="100%" stop-color="#3fb950"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-opacity="0.2"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#4da6ff"/>
    </marker>
  </defs>

  <rect width="880" height="320" fill="url(#bg)"/>
  <rect x="0" y="0" width="880" height="3" fill="url(#accent)"/>

  <text x="440" y="42" text-anchor="middle" fill="#4da6ff" font-size="20" font-weight="800">Get Started in 60 Seconds</text>

  <!-- STEP 1 -->
  <rect x="30" y="70" width="240" height="200" rx="16" fill="#1c2a3a" filter="url(#shadow)"/>
  <circle cx="70" cy="100" r="20" fill="#4da6ff" opacity="0.2"/>
  <text x="70" y="106" text-anchor="middle" font-size="18" font-weight="800" fill="#4da6ff">1</text>
  <text x="150" y="108" text-anchor="middle" fill="#e6edf3" font-size="15" font-weight="700">Install Dependencies</text>
  <line x1="50" y1="122" x2="250" y2="122" stroke="#30363d" stroke-width="0.5"/>

  <rect x="50" y="136" width="200" height="56" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <text x="62" y="155" fill="#8b949e" font-size="10" font-family="monospace">git clone https://github</text>
  <text x="62" y="171" fill="#8b949e" font-size="10" font-family="monospace">.com/eco-guard/eco-guard</text>
  <text x="62" y="185" fill="#8b949e" font-size="10" font-family="monospace">cd eco-guard</text>

  <rect x="50" y="198" width="200" height="28" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="150" y="216" text-anchor="middle" fill="#c9d1d9" font-size="10" font-family="monospace">uv sync --group dev</text>

  <text x="150" y="252" text-anchor="middle" fill="#8b949e" font-size="9">Requires Python 3.12+ and uv</text>

  <!-- Arrow -->
  <line x1="275" y1="170" x2="315" y2="170" stroke="#4da6ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- STEP 2 -->
  <rect x="320" y="70" width="240" height="200" rx="16" fill="#1a2a1a" filter="url(#shadow)"/>
  <circle cx="360" cy="100" r="20" fill="#3fb950" opacity="0.2"/>
  <text x="360" y="106" text-anchor="middle" font-size="18" font-weight="800" fill="#3fb950">2</text>
  <text x="440" y="108" text-anchor="middle" fill="#e6edf3" font-size="15" font-weight="700">Start the Server</text>
  <line x1="340" y1="122" x2="540" y2="122" stroke="#1a3a1a" stroke-width="0.5"/>

  <rect x="340" y="136" width="200" height="42" rx="8" fill="#0d1117" stroke="#1a3a1a" stroke-width="1"/>
  <text x="352" y="154" fill="#8b949e" font-size="10" font-family="monospace">uv run uvicorn src.main:</text>
  <text x="352" y="170" fill="#8b949e" font-size="10" font-family="monospace">app --host 0.0.0.0 --port</text>
  <text x="352" y="186" fill="#8b949e" font-size="10" font-family="monospace">8000 --reload</text>

  <text x="440" y="210" text-anchor="middle" fill="#3fb950" font-size="11">⬇ SQLite fallback auto-detected</text>
  <text x="440" y="228" text-anchor="middle" fill="#8b949e" font-size="9">No PostgreSQL needed for dev</text>
  <text x="440" y="252" text-anchor="middle" fill="#8b949e" font-size="9">Tables auto-created on first run</text>

  <!-- Arrow -->
  <line x1="565" y1="170" x2="605" y2="170" stroke="#4da6ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- STEP 3 -->
  <rect x="610" y="70" width="240" height="200" rx="16" fill="#2a1a2a" filter="url(#shadow)"/>
  <circle cx="650" cy="100" r="20" fill="#bc8cff" opacity="0.2"/>
  <text x="650" y="106" text-anchor="middle" font-size="18" font-weight="800" fill="#bc8cff">3</text>
  <text x="730" y="108" text-anchor="middle" fill="#e6edf3" font-size="15" font-weight="700">Explore &amp; Use</text>
  <line x1="630" y1="122" x2="830" y2="122" stroke="#2a1a3a" stroke-width="0.5"/>

  <rect x="630" y="136" width="200" height="42" rx="8" fill="#0d1117" stroke="#2a1a3a" stroke-width="1"/>
  <text x="730" y="152" text-anchor="middle" fill="#bc8cff" font-size="11" font-weight="600">📖 API Docs</text>
  <text x="730" y="170" text-anchor="middle" fill="#8b949e" font-size="11" font-family="monospace">/docs</text>

  <rect x="630" y="185" width="200" height="42" rx="8" fill="#0d1117" stroke="#2a1a3a" stroke-width="1"/>
  <text x="730" y="200" text-anchor="middle" fill="#bc8cff" font-size="11" font-weight="600">🖥 Dashboard</text>
  <text x="730" y="218" text-anchor="middle" fill="#8b949e" font-size="11" font-family="monospace">/dashboard</text>

  <text x="730" y="252" text-anchor="middle" fill="#8b949e" font-size="9">Set up a model to enable inference</text>

  <!-- Bottom bar -->
  <rect x="30" y="285" width="820" height="24" rx="6" fill="#161b22" stroke="#21262d" stroke-width="0.5"/>
  <text x="440" y="302" text-anchor="middle" fill="#8b949e" font-size="9">🔧 Next: Set 2 env vars for production → JWT_SECRET + ADMIN_PASSWORD · then deploy with Docker Compose or Kubernetes Helm chart</text>
</svg>
