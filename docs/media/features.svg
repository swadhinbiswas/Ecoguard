    <linearGradient id="c3" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#2a1a2a"/><stop offset="100%" stop-color="#221422"/></linearGradient>
    <linearGradient id="c4" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#2a201a"/><stop offset="100%" stop-color="#221a14"/></linearGradient>
    <linearGradient id="c5" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#1a202a"/><stop offset="100%" stop-color="#141a22"/></linearGradient>
    <linearGradient id="c6" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#1a2a2a"/><stop offset="100%" stop-color="#142222"/></linearGradient>
    <linearGradient id="c7" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#2a2620"/><stop offset="100%" stop-color="#1e1a16"/></linearGradient>
    <linearGradient id="c8" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#1e2228"/><stop offset="100%" stop-color="#161820"/></linearGradient>
    <linearGradient id="c9" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#201a28"/><stop offset="100%" stop-color="#181420"/></linearGradient>
