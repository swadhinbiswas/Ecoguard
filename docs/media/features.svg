  <text x="28" y="451" fill="#8b949e" font-size="10">• Model Registry — version + promote</text>
  <text x="28" y="468" fill="#8b949e" font-size="10">• Deploy: direct/canary/blue-green/A/B</text>
  <text x="28" y="485" fill="#8b949e" font-size="10">• Datasets from inference logs</text>
  <text x="28" y="502" fill="#8b949e" font-size="10">• Training job tracking</text>
  <text x="28" y="519" fill="#8b949e" font-size="10">• Experiment metrics + comparison</text>

  <rect x="267" y="391" width="240" height="148" rx="10" fill="url(#c6)" filter="url(#shadow)"/>
  <circle cx="294" cy="418" r="14" fill="#3fb950" opacity="0.15"/><text x="294" y="423" text-anchor="middle" font-size="14">⚡</text>
  <text x="314" y="423" fill="#3fb950" font-size="13" font-weight="700">Batch &amp; Fallback</text>
  <line x1="280" y1="433" x2="494" y2="433" stroke="#1a3a3a" stroke-width="0.5"/>
  <text x="280" y="451" fill="#8b949e" font-size="10">• Batch predict up to 100 prompts</text>
  <text x="280" y="468" fill="#8b949e" font-size="10">• Parallel execution + aggregation</text>
  <text x="280" y="485" fill="#8b949e" font-size="10">• Fallback chains (1-5 models)</text>
  <text x="280" y="502" fill="#8b949e" font-size="10">• Auto-retry with timeout per step</text>
  <text x="280" y="519" fill="#8b949e" font-size="10">• Drift → dataset → retrain pipeline</text>

  <rect x="519" y="391" width="240" height="148" rx="10" fill="url(#c9)" filter="url(#shadow)"/>
  <circle cx="546" cy="418" r="14" fill="#bc8cff" opacity="0.15"/><text x="546" y="423" text-anchor="middle" font-size="14">🛠</text>
  <text x="566" y="423" fill="#bc8cff" font-size="13" font-weight="700">SDK &amp; CLI</text>
  <line x1="532" y1="433" x2="746" y2="433" stroke="#2a1a3a" stroke-width="0.5"/>
  <text x="532" y="451" fill="#8b949e" font-size="10">• Python SDK (sync + async)</text>
  <text x="532" y="468" fill="#8b949e" font-size="10">• Drop-in OpenAI client replacement</text>
  <text x="532" y="485" fill="#8b949e" font-size="10">• CLI: chat, cost, guardrails, health</text>
  <text x="532" y="502" fill="#8b949e" font-size="10">• pip install ecoguard</text>
  <text x="532" y="519" fill="#8b949e" font-size="10">• Streaming + async support</text>

  <rect x="771" y="391" width="254" height="148" rx="10" fill="url(#c5)" filter="url(#shadow)"/>
  <circle cx="798" cy="418" r="14" fill="#79c0ff" opacity="0.15"/><text x="798" y="423" text-anchor="middle" font-size="14">📉</text>
  <text x="818" y="423" fill="#79c0ff" font-size="13" font-weight="700">Drift Detection</text>
  <line x1="784" y1="433" x2="1012" y2="433" stroke="#1a2a3a" stroke-width="0.5"/>
  <text x="784" y="451" fill="#8b949e" font-size="10">• Z-score statistical drift</text>
  <text x="784" y="468" fill="#8b949e" font-size="10">• Auto-retraining pipeline triggers</text>
  <text x="784" y="485" fill="#8b949e" font-size="10">• Webhook + email alerts</text>
  <text x="784" y="502" fill="#8b949e" font-size="10">• Cooldown window to prevent spam</text>
  <text x="784" y="519" fill="#8b949e" font-size="10">• Drift score in every response</text>

  <!-- Bottom row -->
  <rect x="15" y="551" width="328" height="80" rx="10" fill="url(#c1)" filter="url(#shadow)"/>
  <circle cx="42" cy="581" r="14" fill="#4da6ff" opacity="0.15"/><text x="42" y="586" text-anchor="middle" font-size="14">🐳</text>
  <text x="64" y="584" fill="#4da6ff" font-size="13" font-weight="700">Deploy Anywhere</text>
