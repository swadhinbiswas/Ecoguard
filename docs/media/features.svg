  <text x="405" y="618" fill="#8b949e" font-size="10">Dark theme · Pinia state · JWT httpOnly cookies · Demo mode · Responsive</text>

  <rect x="697" y="551" width="328" height="80" rx="10" fill="url(#c3)" filter="url(#shadow)"/>
  <circle cx="724" cy="581" r="14" fill="#bc8cff" opacity="0.15"/><text x="724" y="586" text-anchor="middle" font-size="14">🧠</text>
  <text x="746" y="584" fill="#bc8cff" font-size="13" font-weight="700">GPU Monitoring</text>
  <text x="746" y="602" fill="#8b949e" font-size="10">nvidia-smi → Prometheus · Utilization · Memory · Temperature · Power</text>
  <text x="746" y="618" fill="#8b949e" font-size="10">Grafana dashboard · Alerts on GPU anomalies · Multi-GPU support</text>

  <!-- Footer bar -->
  <rect x="15" y="660" width="1010" height="35" rx="8" fill="#161b22" stroke="#21262d" stroke-width="0.5"/>
  <text x="520" y="682" text-anchor="middle" fill="#8b949e" font-size="10">Self-hosted · MIT · Python 3.12+ · FastAPI · Vue 3 · PostgreSQL/SQLite · Redis · Prometheus · OTel · PyYAML · llama.cpp</text>
