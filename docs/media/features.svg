  <circle cx="798" cy="259" r="14" fill="#3fb950" opacity="0.15"/><text x="798" y="264" text-anchor="middle" font-size="14">⚙️</text>
  <text x="818" y="264" fill="#3fb950" font-size="13" font-weight="700">Operations</text>
  <line x1="784" y1="274" x2="1012" y2="274" stroke="#1a3a1a" stroke-width="0.5"/>
  <text x="784" y="292" fill="#8b949e" font-size="10">• Rate limiting (sliding win + Redis)</text>
  <text x="784" y="309" fill="#8b949e" font-size="10">• Circuit breaker + auto-recovery</text>
  <text x="784" y="326" fill="#8b949e" font-size="10">• Exponential backoff retry</text>
  <text x="784" y="343" fill="#8b949e" font-size="10">• Request timeout + concurrency limit</text>
  <text x="784" y="360" fill="#8b949e" font-size="10">• Graceful shutdown with drain</text>

  <!-- Row 3 -->
  <rect x="15" y="391" width="240" height="148" rx="10" fill="url(#c4)" filter="url(#shadow)"/>
  <circle cx="42" cy="418" r="14" fill="#f0883e" opacity="0.15"/><text x="42" y="423" text-anchor="middle" font-size="14">🤖</text>
  <text x="62" y="423" fill="#f0883e" font-size="13" font-weight="700">MLOps Platform</text>
