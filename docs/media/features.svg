  <rect width="1040" height="720" fill="url(#bg)"/>
  <rect x="0" y="0" width="1040" height="3" fill="url(#accent)"/>

  <text x="520" y="38" text-anchor="middle" fill="#4da6ff" font-size="22" font-weight="800">Eco-Guard — What's Included</text>
  <text x="520" y="56" text-anchor="middle" fill="#8b949e" font-size="11">Self-Hosted LLM Inference Gateway · OpenAI-Compatible API · MLOps Platform · Cost Governance · Guardrails</text>

  <!-- Row 1 -->
  <rect x="15" y="73" width="240" height="148" rx="10" fill="url(#c1)" filter="url(#shadow)"/>
  <circle cx="42" cy="100" r="14" fill="#4da6ff" opacity="0.15"/><text x="42" y="105" text-anchor="middle" font-size="14">🔌</text>
  <text x="62" y="105" fill="#4da6ff" font-size="13" font-weight="700">OpenAI-Compatible API</text>
  <line x1="28" y1="115" x2="242" y2="115" stroke="#1a2a3a" stroke-width="0.5"/>
  <text x="28" y="133" fill="#8b949e" font-size="10">• /v1/chat/completions + SSE</text>
  <text x="28" y="150" fill="#8b949e" font-size="10">• /v1/embeddings endpoint</text>
  <text x="28" y="167" fill="#8b949e" font-size="10">• Drop-in baseURL replacement</text>
  <text x="28" y="184" fill="#8b949e" font-size="10">• Tool/function calling support</text>
  <text x="28" y="201" fill="#8b949e" font-size="10">• JSON mode + response_format</text>

  <rect x="267" y="73" width="240" height="148" rx="10" fill="url(#c2)" filter="url(#shadow)"/>
  <circle cx="294" cy="100" r="14" fill="#3fb950" opacity="0.15"/><text x="294" y="105" text-anchor="middle" font-size="14">🦙</text>
  <text x="314" y="105" fill="#3fb950" font-size="13" font-weight="700">Multi-Backend</text>
  <line x1="280" y1="115" x2="494" y2="115" stroke="#1a3a1a" stroke-width="0.5"/>
  <text x="280" y="133" fill="#8b949e" font-size="10">• llama.cpp — local GGUF models</text>
  <text x="280" y="150" fill="#8b949e" font-size="10">• Ollama, vLLM, TGI support</text>
  <text x="280" y="167" fill="#8b949e" font-size="10">• Any OpenAI-compatible server</text>
  <text x="280" y="184" fill="#8b949e" font-size="10">• Runtime backend switching</text>
  <text x="280" y="201" fill="#8b949e" font-size="10">• Pattern-based model routing</text>

  <rect x="519" y="73" width="240" height="148" rx="10" fill="url(#c3)" filter="url(#shadow)"/>
  <circle cx="546" cy="100" r="14" fill="#bc8cff" opacity="0.15"/><text x="546" y="105" text-anchor="middle" font-size="14">🔒</text>
  <text x="566" y="105" fill="#bc8cff" font-size="13" font-weight="700">Security &amp; Auth</text>
  <line x1="532" y1="115" x2="746" y2="115" stroke="#2a1a3a" stroke-width="0.5"/>
  <text x="532" y="133" fill="#8b949e" font-size="10">• JWT auth with httpOnly cookies</text>
  <text x="532" y="150" fill="#8b949e" font-size="10">• Hashed API key authentication</text>
  <text x="532" y="167" fill="#8b949e" font-size="10">• Brute-force login protection</text>
  <text x="532" y="184" fill="#8b949e" font-size="10">• CSP + HSTS + security headers</text>
  <text x="532" y="201" fill="#8b949e" font-size="10">• Scrypt password hashing</text>

  <rect x="771" y="73" width="254" height="148" rx="10" fill="url(#c4)" filter="url(#shadow)"/>
  <circle cx="798" cy="100" r="14" fill="#f0883e" opacity="0.15"/><text x="798" y="105" text-anchor="middle" font-size="14">🛡</text>
  <text x="818" y="105" fill="#f0883e" font-size="13" font-weight="700">Guardrails Pipeline</text>
  <line x1="784" y1="115" x2="1012" y2="115" stroke="#3a2a1a" stroke-width="0.5"/>
  <text x="784" y="133" fill="#8b949e" font-size="10">• Prompt injection detection</text>
  <text x="784" y="150" fill="#8b949e" font-size="10">• PII redaction (SSN, CC, email)</text>
  <text x="784" y="167" fill="#8b949e" font-size="10">• Content safety (toxicity, etc)</text>
  <text x="784" y="184" fill="#8b949e" font-size="10">• Per-stage: block/flag/sanitize</text>
  <text x="784" y="201" fill="#8b949e" font-size="10">• Pluggable architecture</text>

  <!-- Row 2 -->
  <rect x="15" y="232" width="240" height="148" rx="10" fill="url(#c7)" filter="url(#shadow)"/>
  <circle cx="42" cy="259" r="14" fill="#d29922" opacity="0.15"/><text x="42" y="264" text-anchor="middle" font-size="14">💰</text>
  <text x="62" y="264" fill="#d29922" font-size="13" font-weight="700">Cost Tracking</text>
  <line x1="28" y1="274" x2="242" y2="274" stroke="#3a2a1a" stroke-width="0.5"/>
  <text x="28" y="292" fill="#8b949e" font-size="10">• Per-model pricing config</text>
  <text x="28" y="309" fill="#8b949e" font-size="10">• Pre-request cost estimation</text>
  <text x="28" y="326" fill="#8b949e" font-size="10">• Usage analytics over time</text>
  <text x="28" y="343" fill="#8b949e" font-size="10">• 7 models pre-configured</text>
  <text x="28" y="360" fill="#8b949e" font-size="10">• Custom pricing API</text>

  <rect x="267" y="232" width="240" height="148" rx="10" fill="url(#c8)" filter="url(#shadow)"/>
  <circle cx="294" cy="259" r="14" fill="#79c0ff" opacity="0.15"/><text x="294" y="264" text-anchor="middle" font-size="14">📁</text>
  <text x="314" y="264" fill="#79c0ff" font-size="13" font-weight="700">GitOps Config</text>
  <line x1="280" y1="274" x2="494" y2="274" stroke="#1a2a3a" stroke-width="0.5"/>
  <text x="280" y="292" fill="#8b949e" font-size="10">• ecoguard.yaml hot-reload</text>
  <text x="280" y="309" fill="#8b949e" font-size="10">• Routes, keys, pricing in YAML</text>
  <text x="280" y="326" fill="#8b949e" font-size="10">• Guardrails toggle in YAML</text>
  <text x="280" y="343" fill="#8b949e" font-size="10">• Rate limits in YAML</text>
  <text x="280" y="360" fill="#8b949e" font-size="10">• git push to reconfigure</text>

  <rect x="519" y="232" width="240" height="148" rx="10" fill="url(#c5)" filter="url(#shadow)"/>
  <circle cx="546" cy="259" r="14" fill="#4da6ff" opacity="0.15"/><text x="546" y="264" text-anchor="middle" font-size="14">📊</text>
  <text x="566" y="264" fill="#4da6ff" font-size="13" font-weight="700">Observability</text>
  <line x1="532" y1="274" x2="746" y2="274" stroke="#1a2a3a" stroke-width="0.5"/>
  <text x="532" y="292" fill="#8b949e" font-size="10">• Prometheus metrics endpoint</text>
  <text x="532" y="309" fill="#8b949e" font-size="10">• WebSocket real-time push</text>
  <text x="532" y="326" fill="#8b949e" font-size="10">• OpenTelemetry tracing</text>
  <text x="532" y="343" fill="#8b949e" font-size="10">• Structured JSON logging (prod)</text>
  <text x="532" y="360" fill="#8b949e" font-size="10">• Grafana dashboard included</text>

