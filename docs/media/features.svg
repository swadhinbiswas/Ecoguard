      <stop offset="0%" stop-color="#4da6ff"/>
      <stop offset="100%" stop-color="#3fb950"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.2"/></filter>
    <linearGradient id="c1" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#1c2a3a"/><stop offset="100%" stop-color="#162230"/></linearGradient>
