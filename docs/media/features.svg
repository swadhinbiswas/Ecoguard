  <text x="64" y="618" fill="#8b949e" font-size="10">Alembic migrations · CI ready · NetworkPolicy + PDB + HPA in Helm chart</text>

  <rect x="356" y="551" width="328" height="80" rx="10" fill="url(#c2)" filter="url(#shadow)"/>
  <circle cx="383" cy="581" r="14" fill="#3fb950" opacity="0.15"/><text x="383" y="586" text-anchor="middle" font-size="14">🖥</text>
