services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:${ECOGUARD_DOCKER_POSTGRES_PASSWORD:-ecoguard-local-password}@postgres:5432/ecoguard
      - MODEL_PATH=/app/models/tinyllama.gguf
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      - AUTH_ENABLED=true
      - API_KEYS=[]
      - JWT_SECRET=${ECOGUARD_DOCKER_JWT_SECRET:-local-dev-jwt-secret-change-before-sharing-123456}
      - ADMIN_USERNAME=${ECOGUARD_DOCKER_ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ECOGUARD_DOCKER_ADMIN_PASSWORD:-change-me-before-sharing}
      - CORS_ORIGINS=${ECOGUARD_DOCKER_CORS_ORIGINS:-["http://localhost:8000","http://localhost:5173"]}
      - RATE_LIMIT_ENABLED=true
      - METRICS_ENABLED=true
      - CACHE_ENABLED=false
      - AUTO_MIGRATE=true
    volumes:
      - ./models:/app/models:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${ECOGUARD_DOCKER_POSTGRES_PASSWORD:-ecoguard-local-password}
      - POSTGRES_DB=ecoguard
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ecoguard"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
