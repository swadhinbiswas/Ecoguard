name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --group dev
      - run: uv run ruff check src/ tests/
      - run: uv run ruff format --check src/ tests/
      - run: uv run mypy src/ --ignore-missing-imports || true

  test:
    name: Test (Python 3.12)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --group dev
      - run: |
          uv run pytest tests/ -v \
            --cov=src \
            --cov-report=xml \
            --cov-report=term-missing \
            --junitxml=junit.xml \
            -m "not integration"
        env:
          ENVIRONMENT: test
          AUTH_ENABLED: false
      - run: uv run pytest tests/ -v -m "integration" --tb=short
        env:
          ENVIRONMENT: test
          AUTH_ENABLED: false
      - uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          flags: unittests
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: junit.xml

  build-frontend:
    name: Build Vue Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: |
          npm ci
          npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: vue-dist
          path: frontend/dist/

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [test, build-frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: vue-dist
          path: frontend/dist/
      - name: Build Docker image
        run: docker build -t ecoguard:latest .
      - name: Verify image
        run: |
          docker run --rm ecoguard:latest python -c "from src.core.config import settings; print(settings.app_name)"

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync
      - run: pip install bandit safety
      - run: bandit -r src/ -ll -f json -o bandit-report.json || true
      - run: safety check --full-report || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: bandit-report.json

  merge-gate:
    name: Ready to Merge
    runs-on: ubuntu-latest
    needs: [lint, test, build-frontend, docker, security]
    if: always()
    steps:
      - name: Check gates
        run: |
          echo "## CI/CD Results" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tests | ${{ needs.test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend | ${{ needs.build-frontend.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker | ${{ needs.docker.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security | ${{ needs.security.result }} |" >> $GITHUB_STEP_SUMMARY

          FAILURES=""
          [[ "${{ needs.lint.result }}" != "success" ]] && FAILURES="$FAILURES lint"
          [[ "${{ needs.test.result }}" != "success" ]] && FAILURES="$FAILURES test"
          [[ "${{ needs.build-frontend.result }}" != "success" ]] && FAILURES="$FAILURES frontend"
          [[ "${{ needs.docker.result }}" != "success" ]] && FAILURES="$FAILURES docker"
          [[ "${{ needs.security.result }}" != "success" ]] && FAILURES="$FAILURES security"

          if [[ -n "$FAILURES" ]]; then
            echo "❌ FAILED:$FAILURES" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          echo "✅ All checks passed — ready to merge" >> $GITHUB_STEP_SUMMARY
